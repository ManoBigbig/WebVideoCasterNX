name: Build WebVideoCasterNX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch development packages
        run: |
          dkp-pacman -S --noconfirm switch-dev

      - name: Verify libnx
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls -la $DEVKITPRO/libnx
          ls -la $DEVKITPRO/libnx/include/switch.h

      - name: Build NRO
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: WebVideoCasterNX-v0.1
          path: |
            WebVideoCasterNX.nro
            WebVideoCasterNX.nacp
          if-no-files-found: error
