name: Build WebVideoCasterNX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch development packages
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm switch-dev

      - name: Verify Switch environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          test -f "$DEVKITPRO/libnx/include/switch.h"
          echo "switch.h encontrado!"
          ls -l "$DEVKITPRO/libnx/include/switch.h"

      - name: Clean
        run: make clean || true

      - name: Build NRO
        run: make -j2

      - name: Verify output
        run: |
          ls -lh WebVideoCasterNX.nro
          ls -lh WebVideoCasterNX.nacp

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: WebVideoCasterNX-v0.1
          path: |
            WebVideoCasterNX.nro
            WebVideoCasterNX.nacp
          if-no-files-found: error
